name: CI

on:
  pull_request:
  push:
    branches: [ci/test-actions] # Change if your default branch is named differently
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" 
      - run: python -m pip install -r requirements.txt ruff
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test