apiVersion: v1
kind: Service
metadata:
  name: {{ include "wuda.fullname" . }}
  labels:
    {{- include "wuda.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "wuda.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
