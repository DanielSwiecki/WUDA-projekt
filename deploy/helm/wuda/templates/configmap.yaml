apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wuda.fullname" . }}
  labels:
    {{- include "wuda.labels" . | nindent 4 }}
data:
  DJANGO_DEBUG: {{ .Values.django.debug | quote }}
  DJANGO_LOG_LEVEL: {{ .Values.django.logLevel | quote }}
  DJANGO_ALLOWED_HOSTS: {{ join "," (compact (concat (list .Values.ingress.host) .Values.django.extraAllowedHosts)) | quote }}
  {{- if .Values.django.csrfTrustedOrigins }}
  DJANGO_CSRF_TRUSTED_ORIGINS: {{ join "," .Values.django.csrfTrustedOrigins | quote }}
  {{- else if .Values.ingress.host }}
  DJANGO_CSRF_TRUSTED_ORIGINS: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host | quote }}
  {{- end }}
  DB_HOST: {{ include "wuda.dbHost" . | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
