{{- if not .Values.django.existingSecret }}
{{- $name := include "wuda.djangoSecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.django.secretKey }}
{{- if not $key }}
{{- if and $old $old.data }}
{{- $key = index $old.data "secret-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 50 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wuda.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ $key | quote }}
---
{{- end }}
{{- if not .Values.database.existingSecret }}
{{- $name := include "wuda.dbSecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.database.password }}
{{- if not $pw }}
{{- if and $old $old.data }}
{{- $pw = index $old.data "password" | b64dec }}
{{- else if .Values.postgresql.enabled }}
{{- $pw = randAlphaNum 24 }}
{{- else }}
{{- fail "set database.password or database.existingSecret when postgresql.enabled=false" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wuda.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pw | quote }}
{{- end }}
